name: MATMA PHP package CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  package-tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
          - php: '8.3'
            laravel: '^11.0'
            testbench: '^9.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, ctype, tokenizer, fileinfo, openssl
          coverage: none
          tools: composer:v2
      - name: Validate package metadata
        run: composer validate --strict
      - name: Select matching Laravel and Testbench versions
        run: composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
      - name: Install dependencies
        # Laravel 11 is a legacy compatibility target with published security advisories.
        # This override applies only to CI resolution; do NOT ship it with MATMA.
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: ${{ matrix.laravel == '^11.0' && '0' || '1' }}
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Check PHP syntax
        run: find src tests benchmarks -name '*.php' -not -path '*/fixtures/*' -print0 | xargs -0 -n1 php -l
      - name: Run package tests
        run: vendor/bin/phpunit -c phpunit.xml
      - name: PHPStan static analysis
        if: ${{ matrix.php == '8.3' && matrix.laravel == '^12.0' }}
        run: composer analyse
      - name: PHPCS focused style checks
        if: ${{ matrix.php == '8.3' && matrix.laravel == '^12.0' }}
        run: composer style:check
      - name: Benchmark AST indexing versus manifest lookup
        if: ${{ matrix.php == '8.3' && matrix.laravel == '^12.0' }}
        run: |
          php benchmarks/benchmark.php --classes=100 --iterations=5 > benchmark-result.json
          cat benchmark-result.json
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.php == '8.3' && matrix.laravel == '^12.0' }}
        with:
          name: matma-phase6-benchmark
          path: benchmark-result.json
          if-no-files-found: error

  laravel-install-smoke:
    name: Laravel 11 app install / php artisan test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, ctype, tokenizer, fileinfo, openssl
          coverage: none
          tools: composer:v2
      - name: Validate fixture Composer metadata
        working-directory: tests/fixtures/laravel-app
        run: composer validate --strict
      - name: Install fixture and local MATMA package via Composer path repository
        working-directory: tests/fixtures/laravel-app
        # Test-only compatibility override for legacy Laravel 11 security advisories.
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: '0'
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run fixture's native Laravel test runner
        working-directory: tests/fixtures/laravel-app
        run: php artisan test

  windows-compatibility:
    name: Windows / PHP 8.3 / Laravel 11
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, ctype, tokenizer, fileinfo, openssl
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Configure supported Laravel and Testbench
        run: composer require --dev "laravel/framework:~11.0" "orchestra/testbench:~9.0" --no-update --no-interaction
      - name: Install dependencies (legacy Laravel 11 test-only advisory override)
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: '0'
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Check PHP syntax
        shell: pwsh
        run: |
          Get-ChildItem src,tests,benchmarks -Recurse -Filter *.php |
            Where-Object { $_.FullName -notmatch '[\\/]fixtures[\\/]' } |
            ForEach-Object {
              & php -l $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "PHP lint failed: $($_.FullName)" }
            }
      - name: Run cross-platform PHPUnit suite
        run: vendor/bin/phpunit.bat -c phpunit.xml
